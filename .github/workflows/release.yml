name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Sign plugin
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          echo "Token length: ${#GRAFANA_ACCESS_POLICY_TOKEN}"
          npx --yes @grafana/sign-plugin@4 || true
          ls -la dist/
          cat dist/MANIFEST.txt 2>/dev/null || echo "No MANIFEST.txt"

      - run: |
          cd dist
          zip -r ../tavs-spinner-panel-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v1
        with:
          files: tavs-spinner-panel-${{ github.ref_name }}.zip
          generate_release_notes: true
