name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Sign plugin (CI)
        id: sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: npm run sign
        continue-on-error: true

      - name: Verify signature
        id: verify
        run: |
          if [ -f dist/MANIFEST.txt ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signature verified."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: CI signing failed. Please sign locally and upload the zip manually."
          fi

      - run: |
          cd dist
          zip -r ../tavs-spinner-panel-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v1
        with:
          files: tavs-spinner-panel-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ${{ steps.verify.outputs.signed == 'true' && '✅ Plugin is signed.' || '⚠️ Plugin was NOT signed by CI. Please download and replace with a locally signed build if needed.' }}
