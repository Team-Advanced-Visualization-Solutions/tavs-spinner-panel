name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm run sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      - run: |
          cd dist
          zip -r ../tavs-spinner-panel-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v1
        with:
          files: tavs-spinner-panel-${{ github.ref_name }}.zip
          generate_release_notes: true
