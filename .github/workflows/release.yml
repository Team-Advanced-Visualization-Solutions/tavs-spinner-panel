name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Sign plugin
        env:
          RAW_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          export GRAFANA_ACCESS_POLICY_TOKEN=$(echo "$RAW_TOKEN" | xargs)
          echo "Token length after trim: ${#GRAFANA_ACCESS_POLICY_TOKEN}"
          npx --yes @grafana/sign-plugin@4

      - name: Verify signature
        run: |
          if [ ! -f dist/MANIFEST.txt ]; then
            echo "ERROR: Plugin was not signed. MANIFEST.txt is missing."
            exit 1
          fi
          echo "Signature verified."

      - run: |
          cd dist
          zip -r ../tavs-spinner-panel-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v1
        with:
          files: tavs-spinner-panel-${{ github.ref_name }}.zip
          generate_release_notes: true
