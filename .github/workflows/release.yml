name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Sign plugin (CI)
        id: sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: npm run sign
        continue-on-error: true

      - name: Verify signature
        id: verify
        run: |
          if [ -f dist/MANIFEST.txt ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signature verified."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: CI signing failed. Please sign locally and upload the zip manually."
          fi

      - name: Package plugin
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          mkdir "${PLUGIN_ID}"
          cp -r dist/* "${PLUGIN_ID}/"
          zip -r "${PLUGIN_ID}-${{ github.ref_name }}.zip" "${PLUGIN_ID}"
          rm -rf "${PLUGIN_ID}"

      - name: Generate SHA1 checksum
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          sha1sum "${PLUGIN_ID}-${{ github.ref_name }}.zip" > "${PLUGIN_ID}-${{ github.ref_name }}.zip.sha1"

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            tavs-spinner-panel-${{ github.ref_name }}.zip
            tavs-spinner-panel-${{ github.ref_name }}.zip.sha1
          generate_release_notes: true
          body: |
            ${{ steps.verify.outputs.signed == 'true' && '✅ Plugin is signed.' || '⚠️ Plugin was NOT signed by CI. Please download and replace with a locally signed build if needed.' }}
